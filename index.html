<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap');
:root {
  /* ---------- BASE ---------- */
  --sz-black: #080E32;     /* Seazone navy — primary brand */
  --sz-white: #FFFFFF;

  /* ---------- AZUL SEAZONE (primary) ---------- */
  --sz-blue-50:  #F0F2FA;
  --sz-blue-100: #DBEAFE;
  --sz-blue-200: #8EC5FF;
  --sz-blue-300: #51A2FF;
  --sz-blue-400: #2B7FFF;
  --sz-blue-500: #0055FF;  /* primary */
  --sz-blue-600: #1447E6;
  --sz-blue-700: #0043CE;
  --sz-blue-800: #1C398E;
  --sz-blue-900: #193CB8;
  --sz-blue-950: #162456;

  /* ---------- CINZA (neutrals) ---------- */
  --sz-gray-50:  #F4F4F4;
  --sz-gray-100: #E6E7EA;
  --sz-gray-200: #DFE6F8;
  --sz-gray-300: #CECFD6;
  --sz-gray-400: #9C9FAD;
  --sz-gray-500: #838698;
  --sz-gray-600: #6A7282;
  --sz-gray-700: #525670;
  --sz-gray-800: #393E5B;
  --sz-gray-900: #212647;
  --sz-gray-950: #141A3C;

  /* ---------- VERMELHO (danger) ---------- */
  --sz-red-50:  #FEF2F2;
  --sz-red-100: #FFE2E2;
  --sz-red-200: #FFA2A2;
  --sz-red-400: #FF6467;
  --sz-red-500: #E7000B;
  --sz-red-600: #C10007;
  --sz-red-700: #9F0712;
  --sz-red-900: #82181A;
  --sz-red-950: #460809;

  /* ---------- LARANJA (warning / highlight) ---------- */
  --sz-orange-50:  #FFF7ED;
  --sz-orange-100: #FFEDD4;
  --sz-orange-300: #FFB86A;
  --sz-orange-500: #FF832B;
  --sz-orange-600: #F54A00;
  --sz-orange-700: #9F2D00;
  --sz-orange-900: #7E2A0C;

  /* ---------- VERDE (success) ---------- */
  --sz-green-50:  #F7FEE7;
  --sz-green-100: #ECFCCA;
  --sz-green-300: #BBF451;
  --sz-green-500: #5EA500;
  --sz-green-600: #3D6300;
  --sz-green-900: #35530E;

  /* ---------- ROXO ---------- */
  --sz-purple-50:  #FAF5FF;
  --sz-purple-500: #9810FA;
  --sz-purple-900: #59168B;

  /* ---------- SEMANTIC ---------- */
  --sz-primary:          var(--sz-blue-500);
  --sz-primary-hover:    var(--sz-blue-600);
  --sz-primary-pressed:  var(--sz-blue-700);
  --sz-primary-fg:       var(--sz-white);

  --sz-bg:               var(--sz-white);
  --sz-bg-muted:         var(--sz-gray-50);
  --sz-bg-subtle:        var(--sz-blue-50);

  --sz-fg:               var(--sz-black);
  --sz-fg-muted:         var(--sz-gray-600);
  --sz-fg-subtle:        var(--sz-gray-500);
  --sz-fg-disabled:      var(--sz-gray-400);

  --sz-border:           var(--sz-gray-300);
  --sz-border-subtle:    #E0E0E0;
  --sz-border-strong:    var(--sz-gray-500);

  --sz-success:          #5EA500;
  --sz-success-bg:       var(--sz-green-100);
  --sz-danger:           #C10007;
  --sz-danger-bg:        var(--sz-red-100);
  --sz-warning:          var(--sz-orange-500);
  --sz-warning-bg:       var(--sz-orange-100);
  --sz-info:             var(--sz-blue-500);
  --sz-info-bg:          var(--sz-blue-100);

  --sz-chip-livre-bg:    #DBEAFE;
  --sz-chip-locado-bg:   #C0CDF3;
  --sz-chip-inativo-bg:  var(--sz-gray-200);

  /* ---------- FONT FAMILIES ---------- */
  --sz-font-display: "Helvetica Neue", "HelveticaNeue", Helvetica, Arial, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
  --sz-font-sans:    "Helvetica Neue", "HelveticaNeue", Helvetica, Arial, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
  --sz-font-ui:      "Helvetica Neue", "HelveticaNeue", "Inter", Helvetica, Arial, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
  --sz-font-mono:    "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;

  /* ---------- TYPE TOKENS (sourced from Tipografia/TOKENS2) ---------- */
  /* Display / Heading */
  --sz-type-h1:      700 48px/56px var(--sz-font-display);
  --sz-type-h2:      500 30px/36px var(--sz-font-display);
  --sz-type-h3:      500 24px/32px var(--sz-font-display);
  --sz-type-h4:      500 20px/28px var(--sz-font-display);
  --sz-type-lead:    400 20px/28px var(--sz-font-display);
  --sz-type-large:   500 18px/28px var(--sz-font-sans);

  /* Body */
  --sz-type-p:             400 16px/28px var(--sz-font-sans);
  --sz-type-p-ui:          400 16px/24px var(--sz-font-sans);
  --sz-type-p-ui-medium:   500 16px/20px var(--sz-font-sans);
  --sz-type-body:          500 14px/24px var(--sz-font-sans);
  --sz-type-body-regular:  400 14px/24px var(--sz-font-sans);
  --sz-type-subtle-medium: 500 14px/20px var(--sz-font-sans);
  --sz-type-subtle:        400 14px/20px var(--sz-font-sans);
  --sz-type-small:         400 14px/14px var(--sz-font-sans);
  --sz-type-detail-medium: 500 12px/20px var(--sz-font-sans);
  --sz-type-detail:        400 12px/20px var(--sz-font-sans);

  /* Table */
  --sz-type-table-head:    500 14px/24px var(--sz-font-sans);
  --sz-type-table-item:    400 14px/20px var(--sz-font-sans);

  /* ---------- SPACING (4px base, Carbon-ish) ---------- */
  --sz-space-2:  4px;
  --sz-space-3:  8px;
  --sz-space-4:  12px;
  --sz-space-5:  16px;
  --sz-space-6:  24px;
  --sz-space-7:  32px;
  --sz-space-8:  40px;
  --sz-space-9:  48px;
  --sz-space-10: 64px;
  --sz-space-11: 80px;
  --sz-space-12: 96px;
  --sz-space-13: 160px;

  /* ---------- RADII ---------- */
  --sz-radius-xs:    2px;
  --sz-radius-sm:    4px;
  --sz-radius-md:    8px;
  --sz-radius-lg:    12px;
  --sz-radius-xl:    16px;
  --sz-radius-full:  999px;   /* ← "Sempre botão full arredondado" */

  /* ---------- SHADOWS ---------- */
  --sz-shadow-menu:   0 2px 6px 0 rgba(0,0,0,.3);
  --sz-shadow-card:   0 0 3.3px 0 rgba(0,0,0,.25);
  --sz-shadow-raised: 0 4px 4px 0 rgba(0,0,0,.25);
  --sz-shadow-modal:  0 20px 40px -8px rgba(8,14,50,.20), 0 4px 12px -2px rgba(8,14,50,.08);
  --sz-shadow-focus:  0 0 0 3px rgba(0,85,255,.25);

  /* ---------- BORDERS ---------- */
  --sz-border-thin:   1px solid var(--sz-border-subtle);
  --sz-border-base:   1px solid var(--sz-border);
  --sz-border-strong-style: 1px solid var(--sz-border-strong);

  /* ---------- MOTION ---------- */
  --sz-ease:          cubic-bezier(.2,.8,.2,1);
  --sz-ease-out:      cubic-bezier(0,.0,.2,1);
  --sz-duration-fast: 120ms;
  --sz-duration-base: 180ms;
  --sz-duration-slow: 280ms;
}

/* ========== SEMANTIC ELEMENT DEFAULTS ========== */
html, body { background: var(--sz-bg); color: var(--sz-fg); }

body {
  font: var(--sz-type-p-ui);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  letter-spacing: 0;
}

h1 { font: var(--sz-type-h1); color: var(--sz-fg); letter-spacing: -0.01em; margin: 0; }
h2 { font: var(--sz-type-h2); color: var(--sz-fg); letter-spacing: -0.005em; margin: 0; }
h3 { font: var(--sz-type-h3); color: var(--sz-fg); margin: 0; }
h4 { font: var(--sz-type-h4); color: var(--sz-fg); margin: 0; }
p  { font: var(--sz-type-p);  color: var(--sz-fg); margin: 0; }
small { font: var(--sz-type-small); color: var(--sz-fg-muted); }
code, kbd, pre { font-family: var(--sz-font-mono); font-size: 12px; }

a { color: var(--sz-primary); text-decoration: none; }
a:hover { text-decoration: underline; }

hr { border: 0; border-top: 1px solid var(--sz-border-subtle); margin: var(--sz-space-6) 0; }

/* Utilities */
.sz-muted    { color: var(--sz-fg-muted); }
.sz-subtle   { color: var(--sz-fg-subtle); }
.sz-mono     { font-family: var(--sz-font-mono); }
</style>
<style>/* ====================================================================
   Desafio Prático · CS Onboarding — estilos
   Branding sutil: cinza/preto dominantes, azul Seazone como sinal
   ==================================================================== */

* { box-sizing: border-box; }
html, body { background: var(--sz-bg-muted); }
body {
  font: var(--sz-type-p);
  color: var(--sz-fg);
  padding-bottom: 80px;
}

button { font: inherit; cursor: pointer; }
textarea, input { font: inherit; color: inherit; }
textarea { resize: vertical; }

/* ========== TOP BAR (sticky) ========== */
.topbar {
  position: sticky;
  top: 0;
  z-index: 50;
  background: var(--sz-bg);
  border-bottom: 1px solid var(--sz-border-subtle);
  padding: 14px 28px;
  display: flex;
  align-items: center;
  gap: 20px;
}
.topbar-brand {
  display: flex;
  align-items: center;
  gap: 12px;
  min-width: 0;
}
.topbar-brand img { height: 20px; flex-shrink: 0; }
.topbar-brand .divider {
  width: 1px;
  height: 18px;
  background: var(--sz-border);
}
.topbar-brand .topbar-title {
  font: var(--sz-type-subtle-medium);
  color: var(--sz-fg);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.topbar-spacer { flex: 1; }

.save-status {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font: var(--sz-type-detail-medium);
  color: var(--sz-fg-muted);
}
.save-dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--sz-success);
}
.save-status.saving .save-dot { background: var(--sz-warning); animation: pulse 1s infinite; }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .4; } }

.progress-pill {
  font: var(--sz-type-detail-medium);
  background: var(--sz-bg-muted);
  color: var(--sz-fg);
  padding: 6px 12px;
  border-radius: var(--sz-radius-full);
  border: 1px solid var(--sz-border-subtle);
}
.progress-pill strong { color: var(--sz-primary); }

.btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 10px 18px;
  border-radius: var(--sz-radius-full);
  border: 1px solid transparent;
  font: var(--sz-type-subtle-medium);
  background: var(--sz-bg-muted);
  color: var(--sz-fg);
  transition: all var(--sz-duration-base) var(--sz-ease);
}
.btn:hover { background: var(--sz-blue-50); color: var(--sz-blue-700); }
.btn-primary {
  background: var(--sz-primary);
  color: var(--sz-primary-fg);
}
.btn-primary:hover { background: var(--sz-primary-hover); color: var(--sz-white); }
.btn-primary:active { background: var(--sz-primary-pressed); transform: scale(.98); }
.btn-ghost { background: transparent; }
.btn-ghost:hover { background: var(--sz-bg-muted); color: var(--sz-fg); }
.btn:disabled { opacity: .4; cursor: not-allowed; }

/* ========== LAYOUT ========== */
.shell {
  max-width: 880px;
  margin: 0 auto;
  padding: 40px 28px 0;
}

/* ========== INTRO ========== */
.intro {
  margin-bottom: 48px;
}
.eyebrow {
  font: var(--sz-type-detail-medium);
  text-transform: uppercase;
  letter-spacing: .12em;
  color: var(--sz-primary);
  margin-bottom: 8px;
}
.intro h1 {
  font: var(--sz-type-h1);
  font-size: 44px;
  line-height: 52px;
  letter-spacing: -0.01em;
  color: var(--sz-fg);
  text-wrap: balance;
}
.intro p.lead {
  margin-top: 16px;
  font: var(--sz-type-lead);
  color: var(--sz-fg-muted);
  max-width: 640px;
  text-wrap: pretty;
}
.meta-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 24px;
}
.meta-chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 12px;
  border-radius: var(--sz-radius-full);
  font: var(--sz-type-detail-medium);
  background: var(--sz-bg-muted);
  color: var(--sz-fg);
  border: 1px solid var(--sz-border-subtle);
}
.meta-chip .dot {
  width: 5px; height: 5px;
  border-radius: 50%;
  background: var(--sz-primary);
}

/* ========== CANDIDATE FORM ========== */
.cand-form {
  margin-top: 32px;
  padding: 20px;
  background: var(--sz-bg);
  border: 1px solid var(--sz-border-subtle);
  border-radius: var(--sz-radius-lg);
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
}
.field { display: flex; flex-direction: column; gap: 6px; }
.field label {
  font: var(--sz-type-detail-medium);
  color: var(--sz-fg-muted);
  text-transform: uppercase;
  letter-spacing: .06em;
}
.field input,
.field textarea {
  padding: 10px 14px;
  border: 1px solid var(--sz-border);
  border-radius: var(--sz-radius-md);
  background: var(--sz-bg);
  font: var(--sz-type-p-ui);
  color: var(--sz-fg);
  transition: border-color var(--sz-duration-base) var(--sz-ease), box-shadow var(--sz-duration-base) var(--sz-ease);
}
.field input:focus,
.field textarea:focus {
  outline: 0;
  border-color: var(--sz-primary);
  box-shadow: var(--sz-shadow-focus);
}

/* ========== TASK CARD ========== */
.task {
  margin-bottom: 32px;
  background: var(--sz-bg);
  border: 1px solid var(--sz-border-subtle);
  border-radius: var(--sz-radius-xl);
  overflow: hidden;
}
.task-header {
  display: flex;
  align-items: flex-start;
  gap: 20px;
  padding: 24px 28px;
  border-bottom: 1px solid var(--sz-border-subtle);
}
.task-num {
  width: 44px; height: 44px;
  flex-shrink: 0;
  border-radius: var(--sz-radius-full);
  background: var(--sz-blue-50);
  color: var(--sz-blue-700);
  display: grid;
  place-items: center;
  font-family: var(--sz-font-display);
  font-weight: 700;
  font-size: 18px;
}
.task-num.complete {
  background: var(--sz-primary);
  color: var(--sz-white);
}
.task-header-text { flex: 1; min-width: 0; }
.task-eyebrow {
  font: var(--sz-type-detail-medium);
  text-transform: uppercase;
  letter-spacing: .1em;
  color: var(--sz-fg-muted);
}
.task-title {
  font: var(--sz-type-h3);
  color: var(--sz-fg);
  margin-top: 2px;
  text-wrap: balance;
}
.task-time {
  font: var(--sz-type-detail-medium);
  color: var(--sz-fg-muted);
  flex-shrink: 0;
  margin-top: 12px;
}

.task-body { padding: 28px; }
.task-body > p { margin: 0 0 12px 0; }
.task-body > p:not(:first-child) { margin-top: 12px; }

.scenario-lead { font: var(--sz-type-p); color: var(--sz-fg); }

.question {
  margin-top: 24px;
  padding-top: 24px;
  border-top: 1px dashed var(--sz-border-subtle);
}
.question:first-of-type {
  margin-top: 24px;
  padding-top: 0;
  border-top: 0;
}
.q-label {
  font: var(--sz-type-detail-medium);
  color: var(--sz-primary);
  text-transform: uppercase;
  letter-spacing: .08em;
  margin-bottom: 6px;
}
.q-text {
  font: var(--sz-type-p-ui-medium);
  color: var(--sz-fg);
  margin-bottom: 12px;
  text-wrap: pretty;
}
.q-hint {
  font: var(--sz-type-detail);
  color: var(--sz-fg-muted);
  margin-bottom: 12px;
}

textarea.answer {
  width: 100%;
  min-height: 100px;
  padding: 14px 16px;
  border: 1px solid var(--sz-border);
  border-radius: var(--sz-radius-md);
  background: var(--sz-bg);
  font: var(--sz-type-p-ui);
  color: var(--sz-fg);
  transition: border-color var(--sz-duration-base) var(--sz-ease), box-shadow var(--sz-duration-base) var(--sz-ease);
}
textarea.answer:focus {
  outline: 0;
  border-color: var(--sz-primary);
  box-shadow: var(--sz-shadow-focus);
}
.answer-meta {
  display: flex;
  justify-content: space-between;
  margin-top: 6px;
  font: var(--sz-type-detail);
  color: var(--sz-fg-muted);
}

/* ========== ALERT / CALLOUT ========== */
.callout {
  margin: 20px 0;
  padding: 14px 18px;
  border-radius: var(--sz-radius-md);
  border-left: 3px solid var(--sz-warning);
  background: var(--sz-orange-50);
  font: var(--sz-type-subtle);
  color: var(--sz-fg);
}
.callout strong { color: var(--sz-orange-900); }
.callout.info {
  background: var(--sz-bg-subtle);
  border-left-color: var(--sz-primary);
}
.callout.info strong { color: var(--sz-blue-700); }

/* ========== PROPERTY LIST (Tarefa 1) ========== */
.prop-list {
  margin-top: 8px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.prop-row {
  display: flex;
  align-items: stretch;
  background: var(--sz-bg);
  border: 1px solid var(--sz-border-subtle);
  border-radius: var(--sz-radius-md);
  overflow: hidden;
  transition: box-shadow var(--sz-duration-base) var(--sz-ease), border-color var(--sz-duration-base) var(--sz-ease);
}
.prop-row:hover {
  box-shadow: var(--sz-shadow-card);
  border-color: var(--sz-border);
}
.prop-rank {
  width: 56px;
  flex-shrink: 0;
  background: var(--sz-bg-muted);
  display: grid;
  place-items: center;
  font-family: var(--sz-font-display);
  font-weight: 700;
  font-size: 22px;
  color: var(--sz-fg);
  border-right: 1px solid var(--sz-border-subtle);
}
.prop-rank.priority-1 { background: var(--sz-primary); color: var(--sz-white); }
.prop-rank.priority-2 { background: var(--sz-blue-300); color: var(--sz-white); }
.prop-rank.priority-3 { background: var(--sz-blue-100); color: var(--sz-blue-800); }

.prop-content {
  flex: 1;
  padding: 14px 16px;
  display: grid;
  grid-template-columns: 110px 1fr 1fr;
  gap: 8px 20px;
  align-items: center;
  min-width: 0;
}
.prop-code {
  font-family: var(--sz-font-mono);
  font-weight: 500;
  font-size: 14px;
  color: var(--sz-fg);
}
.prop-city {
  font: var(--sz-type-detail);
  color: var(--sz-fg-muted);
  margin-top: 2px;
}
.prop-main {
  font: var(--sz-type-subtle-medium);
  color: var(--sz-fg);
}
.prop-sub {
  font: var(--sz-type-detail);
  color: var(--sz-fg-muted);
  margin-top: 2px;
}
.prop-meta {
  display: flex;
  flex-direction: column;
  gap: 4px;
  font: var(--sz-type-detail);
}
.prop-tag {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font: var(--sz-type-detail-medium);
  color: var(--sz-fg-muted);
}
.prop-tag::before {
  content: ""; width: 6px; height: 6px; border-radius: 50%;
}
.prop-tag.em-fluxo::before { background: var(--sz-success); }
.prop-tag.em-fluxo { color: var(--sz-green-900); }
.prop-tag.atencao::before { background: #EAB308; }
.prop-tag.atencao { color: #854D0E; }
.prop-tag.pausado::before { background: var(--sz-warning); }
.prop-tag.pausado { color: var(--sz-orange-900); }
.prop-tag.travado::before { background: var(--sz-orange-700); }
.prop-tag.travado { color: var(--sz-orange-900); }
.prop-tag.em-risco::before { background: var(--sz-danger); }
.prop-tag.em-risco { color: var(--sz-red-900); }

.prop-controls {
  display: flex;
  flex-direction: column;
  border-left: 1px solid var(--sz-border-subtle);
}
.prop-controls button {
  width: 40px;
  flex: 1;
  background: var(--sz-bg);
  border: 0;
  border-bottom: 1px solid var(--sz-border-subtle);
  color: var(--sz-fg-muted);

<body>
<div id="root"></div>

<script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script crossorigin src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>
<script crossorigin src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>

<script type="text/babel" data-presets="react">

/* SUPABASE — only the publishable (anon) key is here.
   service_role / sb_secret MUST NEVER be embedded in this file.
   RLS policies on the responses table protect data. */
const SUPABASE_URL = "https://fsqybshlmqpbeprkvkei.supabase.co";
const SUPABASE_PUBLISHABLE = "sb_publishable_WvimhJCgNLGFF119OtHWsQ_BselyvEA";

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE, {
  auth: { persistSession: true, autoRefreshToken: true, storageKey: 'sz-admin-auth' },
});

const { useState, useEffect, useRef, useCallback } = React;

const STORAGE_KEY = "seazone-cs-onboarding-desafio-v2";

const PROPERTIES = [
  { id: "GAR1102", code: "GAR 1102", city: "Garopaba",      days: 65, stage: "Vistoria reagendada 2x",    profile: "Reclamação aberta na Ouvidoria", lastContact: "Há 3 dias", status: "em-risco", statusLabel: "Em risco" },
  { id: "SPJ0303", code: "SPJ 0303", city: "Florianópolis", days: 42, stage: "Aguardando fotos",          profile: "1ª implantação, ansioso",         lastContact: "Há 6 dias", status: "atencao",  statusLabel: "Em fluxo" },
  { id: "CAN0414", code: "CAN 0414", city: "Canasvieiras",  days: 19, stage: "Pronto para ativação",      profile: "Proprietário sumido",             lastContact: "Há 9 dias", status: "travado",  statusLabel: "Travado" },
  { id: "BLN1208", code: "BLN 1208", city: "Bombinhas",     days: 12, stage: "Coleta de chaves",          profile: "Investidor com 4 imóveis",        lastContact: "Há 3 dias", status: "em-fluxo", statusLabel: "Em fluxo" },
  { id: "ITP0507", code: "ITP 0507", city: "Itapema",       days: 28, stage: "Adequação enxoval",         profile: "Idoso, prefere ligação",          lastContact: "Há 3 dias", status: "em-fluxo", statusLabel: "Em fluxo" },
];

const DEFAULT_STATE = {
  candidato: { nome: "", email: "" },
  t1: { ordem: ["GAR1102", "SPJ0303", "CAN0414", "BLN1208", "ITP0507"], justificativa: "" },
  t2: { mensagem: "", plano: "" },
  t3: { mensagem_proprietario: "", mensagem_operacao: "" },
};

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return DEFAULT_STATE;
    const parsed = JSON.parse(raw);
    return { ...DEFAULT_STATE, ...parsed,
      candidato: { ...DEFAULT_STATE.candidato, ...(parsed.candidato || {}) },
      t1: { ...DEFAULT_STATE.t1, ...(parsed.t1 || {}) },
      t2: { ...DEFAULT_STATE.t2, ...(parsed.t2 || {}) },
      t3: { ...DEFAULT_STATE.t3, ...(parsed.t3 || {}) },
    };
  } catch (e) { return DEFAULT_STATE; }
}

function wordCount(s) {
  if (!s) return 0;
  return s.trim().split(/\s+/).filter(Boolean).length;
}

const EMAIL_RX = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

function generateExportText(state) {
  const propsById = Object.fromEntries(PROPERTIES.map((p) => [p.id, p]));
  const nome = state.candidato.nome || "(não preenchido)";
  const email = state.candidato.email || "(não preenchido)";
  const data = new Date().toLocaleString("pt-BR", { dateStyle: "long", timeStyle: "short" });
  const L = [];
  L.push("# Desafio Prático · CS Onboarding · Seazone", "");
  L.push("**Candidato:** " + nome);
  L.push("**E-mail:** " + email);
  L.push("**Enviado em:** " + data, "", "---", "");
  L.push("## Tarefa 01 — Priorização da fila", "", "**Ordem de prioridade:**", "");
  state.t1.ordem.forEach((id, i) => {
    const p = propsById[id]; if (!p) return;
    L.push((i + 1) + ". **" + p.code + "** · " + p.city + " · " + p.days + " dias · " + p.stage);
  });
  L.push("", "**Justificativa:**", "");
  L.push(state.t1.justificativa.trim() || "_(não respondido)_");
  L.push("", "---", "");
  L.push("## Tarefa 02 — Comunicação de retenção", "", "**Resposta ao João Mendes (WhatsApp):**", "");
  L.push(state.t2.mensagem.trim() || "_(não respondido)_");
  L.push("", "---", "");
  L.push("## Tarefa 03 — Conflito interno sob pressão", "", "**Mensagem para a Carla (cliente):**", "");
  L.push(state.t3.mensagem_proprietario.trim() || "_(não respondido)_");
  L.push("", "**Mensagem para Operação (interno):**", "");
  L.push(state.t3.mensagem_operacao.trim() || "_(não respondido)_", "");
  return L.join("\n");
}

// ===== TASKS =====
function Task1Priorizacao({ value, onChange }) {
  const ordem = value.ordem;
  const move = (idx, dir) => {
    const newIdx = idx + dir;
    if (newIdx < 0 || newIdx >= ordem.length) return;
    const next = ordem.slice();
    [next[idx], next[newIdx]] = [next[newIdx], next[idx]];
    onChange({ ...value, ordem: next });
  };
  const propsById = Object.fromEntries(PROPERTIES.map((p) => [p.id, p]));
  const isComplete = value.justificativa.trim().length > 80;
  return (
    <article className="task">
      <header className="task-header">
        <div className={"task-num" + (isComplete ? " complete" : "")}>01</div>
        <div className="task-header-text">
          <div className="task-eyebrow">Priorização da fila</div>
          <div className="task-title">É sua primeira segunda-feira. Por onde você começa?</div>
        </div>
        <div className="task-time">~15 min</div>
      </header>
      <div className="task-body">
        <p className="scenario-lead">
          Sua coordenadora acabou de te entregar 5 imóveis em implantação e disse:{" "}
          <em>"Todos esses atendimentos precisam acontecer hoje. Me conta como você vai priorizar."</em>{" "}
          O SLA-meta de ativação é <strong>30 dias</strong>; em alta temporada (dez–fev), cada dia parado pesa no bolso do proprietário.
        </p>
        <div className="callout info">
          <strong>Para referência —</strong> a jornada de implantação segue esta ordem:{" "}
          <span style={{ font: "var(--sz-type-subtle-medium)" }}>
            Coleta de chaves → Vistoria → Enxoval → Adequação → Fotografias → Ativação do anúncio
          </span>
        </div>
        <div className="question">
          <div className="q-label">a. Ordene por prioridade</div>
          <div className="q-text">
            Todos os 5 atendimentos precisam acontecer hoje. Use os controles <strong>↑ ↓</strong>{" "}
            para reordenar. A posição 1 é o seu <strong>primeiro atendimento do dia</strong>.
          </div>
          <div className="prop-list">
            {ordem.map((id, idx) => {
              const p = propsById[id];
              const pclass = idx === 0 ? "priority-1" : idx === 1 ? "priority-2" : idx === 2 ? "priority-3" : "";
              return (
                <div className="prop-row" key={id}>
                  <div className={"prop-rank " + pclass}>{idx + 1}</div>
                  <div className="prop-content">
                    <div>
                      <div className="prop-code">{p.code}</div>
                      <div className="prop-city">{p.city}</div>
                    </div>
                    <div>
                      <div className="prop-main">{p.stage}</div>
                      <div className="prop-sub">{p.profile}</div>
                    </div>
                    <div className="prop-meta">
                      <div className="prop-sub"><strong>{p.days} dias</strong> em implantação</div>
                      <div className="prop-sub">Último contato: {p.lastContact}</div>
                    </div>
                  </div>
                  <div className="prop-controls">
                    <button onClick={() => move(idx, -1)} disabled={idx === 0} aria-label="Mover para cima" title="Mover para cima">↑</button>
                    <button onClick={() => move(idx, 1)} disabled={idx === ordem.length - 1} aria-label="Mover para baixo" title="Mover para baixo">↓</button>
                  </div>
                </div>
              );
            })}
          </div>
          <div className="ranking-legend">
            <span><i style={{ background: "var(--sz-primary)" }}></i>1ª prioridade</span>
            <span><i style={{ background: "var(--sz-blue-300)" }}></i>2ª</span>
            <span><i style={{ background: "var(--sz-blue-100)" }}></i>3ª</span>
          </div>
        </div>
        <div className="question">
          <div className="q-label">b. Justifique o critério</div>
          <div className="q-text">
            Em poucas linhas, qual foi o critério que orientou sua ordenação? Quais imóveis você
            considera <strong>com maior risco de churn</strong> e por quê?
          </div>
          <textarea
            className="answer"
            maxLength={5000}
            placeholder=""
            value={value.justificativa}
            onChange={(e) => onChange({ ...value, justificativa: e.target.value })}
          />
          <div className="answer-meta">
            <span>{wordCount(value.justificativa)} palavras</span>
            <span>Sugestão: 60–120 palavras</span>
          </div>
        </div>
      </div>
    </article>
  );
}

function Task2Retencao({ value, onChange }) {
  const isComplete = value.mensagem.trim().length > 80;
  return (
    <article className="task">
      <header className="task-header">
        <div className={"task-num" + (isComplete ? " complete" : "")}>02</div>
        <div className="task-header-text">
          <div className="task-eyebrow">Comunicação de retenção</div>

function App() {
  const [state, setState] = useState(loadState);
  const [savedAt, setSavedAt] = useState(null);
  const [saving, setSaving] = useState(false);
  const [showExport, setShowExport] = useState(false);
  const [showAdmin, setShowAdmin] = useState(false);
  const saveTimer = useRef(null);

  useEffect(() => {
    setSaving(true);
    clearTimeout(saveTimer.current);
    saveTimer.current = setTimeout(() => {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); setSavedAt(new Date()); } catch (e) {}
      setSaving(false);
    }, 400);
    return () => clearTimeout(saveTimer.current);
  }, [state]);

  const setCandidato = (patch) => setState((s) => ({ ...s, candidato: { ...s.candidato, ...patch } }));
  const setT1 = (v) => setState((s) => ({ ...s, t1: v }));
  const setT2 = (v) => setState((s) => ({ ...s, t2: v }));
  const setT3 = (v) => setState((s) => ({ ...s, t3: v }));

  const t1Done = state.t1.justificativa.trim().length > 80;
  const t2Done = state.t2.mensagem.trim().length > 80;
  const t3Done = state.t3.mensagem_proprietario.trim().length > 60 && state.t3.mensagem_operacao.trim().length > 40;
  const candidatoDone = state.candidato.nome.trim().length > 0 && EMAIL_RX.test(state.candidato.email.trim());
  const completedTasks = [t1Done, t2Done, t3Done].filter(Boolean).length;

  const handleClear = () => {
    if (!confirm("Apagar todas as respostas e começar do zero?")) return;
    localStorage.removeItem(STORAGE_KEY);
    setState(DEFAULT_STATE);
  };

  const exportText = generateExportText(state);

  return (
    <>
      <TopBar saving={saving} savedAt={savedAt} completed={completedTasks} total={3} onExport={() => setShowExport(true)} />
      <div className="shell">
        <Intro candidato={state.candidato} onChange={setCandidato} />
        <Task1Priorizacao value={state.t1} onChange={setT1} />
        <Task2Retencao value={state.t2} onChange={setT2} />
        <Task3Conflito value={state.t3} onChange={setT3} />
        <FinishSection
          candidatoDone={candidatoDone} t1Done={t1Done} t2Done={t2Done} t3Done={t3Done}
          onExport={() => setShowExport(true)} onClear={handleClear}
        />
        <Footer onAdmin={() => setShowAdmin(true)} />
      </div>
      {showExport && (
        <ExportModal
          state={state}
          text={exportText}
          candidato={state.candidato}
          canSubmit={candidatoDone}
          onClose={() => setShowExport(false)}
        />
      )}
      {showAdmin && <AdminModal onClose={() => setShowAdmin(false)} />}
    </>
  );
}

// ===== EXPORT MODAL — with Supabase submit =====
function ExportModal({ state, text, candidato, canSubmit, onClose }) {
  const [copied, setCopied] = useState(false);
  const [sending, setSending] = useState(false);
  const [sentId, setSentId] = useState(null);
  const [sendError, setSendError] = useState(null);

  const handleCopy = async () => {
    try { await navigator.clipboard.writeText(text); setCopied(true); setTimeout(() => setCopied(false), 2000); }
    catch (e) { alert("Não consegui copiar automaticamente. Selecione e copie o texto manualmente."); }
  };

  const safeFileBase = (candidato.nome || "candidato").trim().toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || "candidato";

  const handleDownload = () => {
    const blob = new Blob([text], { type: "text/markdown;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = "desafio-cs-onboarding-" + safeFileBase + ".md";
    document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
  };

  const handleSubmit = async () => {
    if (!canSubmit) { setSendError("Preencha nome e e-mail antes de enviar."); return; }
    setSending(true); setSendError(null);
    try {
      const { error } = await sb.from("responses").insert({
        candidato_nome: candidato.nome.trim().slice(0, 200),
        candidato_email: candidato.email.trim().slice(0, 320),
        payload: state,
        resumo_md: text.slice(0, 200000),
      });
      if (error) throw error;
      setSentId(true);
    } catch (e) {
      setSendError(e && e.message ? e.message : "Não foi possível enviar. Tente de novo em alguns segundos.");
    } finally { setSending(false); }
  };

  return (
    <div className="modal-backdrop" onClick={onClose}>
      <div className="modal" onClick={(e) => e.stopPropagation()}>
        <div className="modal-head">
          <h2>{sentId ? "Resposta enviada para a Seazone" : "Resumo para envio"}</h2>
          <button onClick={onClose} aria-label="Fechar">×</button>
        </div>
        <div className="modal-body">
          {sentId ? (
            <div className="admin-success" style={{ marginBottom: 16 }}>
              ✓ Resposta enviada com sucesso. O time de CS da Seazone receberá a notificação.
            </div>
          ) : (
            <>
              <p style={{ font: "var(--sz-type-subtle)", color: "var(--sz-fg-muted)", marginBottom: 12 }}>
                Confira o resumo abaixo. Clique em <strong>Enviar para a Seazone</strong> para registrar
                oficialmente sua resposta. Você também pode <strong>copiar</strong> ou <strong>baixar</strong>{" "}
                como backup pessoal.
              </p>
              {sendError && <div className="admin-error" style={{ marginBottom: 12 }}>{sendError}</div>}
              {!canSubmit && (
                <div className="callout" style={{ marginTop: 0, marginBottom: 12 }}>
                  <strong>Antes de enviar:</strong> preencha seu nome e um e-mail válido na seção de identificação.
                </div>
              )}
            </>
          )}
          <pre>{text}</pre>
        </div>
        <div className="modal-foot">
          <button className="btn btn-ghost" onClick={onClose}>Voltar</button>
          <button className="btn" onClick={handleDownload}>Baixar .md</button>
          <button className="btn" onClick={handleCopy}>{copied ? "Copiado ✓" : "Copiar"}</button>
          {!sentId && (
            <button className="btn btn-primary" onClick={handleSubmit} disabled={sending || !canSubmit}>
              {sending ? "Enviando…" : "Enviar para Seazone"}
            </button>
          )}
        </div>
      </div>
    </div>
  );
}

function AdminModal({ onClose }) {
  const [session, setSession] = useState(null);

  useEffect(() => {

    sb.auth.getSession().then(({ data }) => { if (mounted) { setSession(data.session); setChecking(false); } });

    return () => { mounted = false; sub.subscription.unsubscribe(); };
  }, []);

  return (
    <div className="modal-backdrop" onClick={onClose}>
      <div className={"modal" + (session ? " wide" : "")} onClick={(e) => e.stopPropagation()}>

  );

function AdminLogin() {
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState(null);

  const submit = async (e) => {
    e.preventDefault();
    setBusy(true); setErr(null);
    try {
      const { error } = await sb.auth.signInWithPassword({ email: email.trim(), password });
      if (error) throw error;
    } catch (ex) {
      setErr("Credenciais inválidas.");
    } finally { setBusy(false); }
  };

  return (
    <form className="admin-login-form" onSubmit={submit} autoComplete="off">
      <p style={{ font: "var(--sz-type-subtle)", color: "var(--sz-fg-muted)" }}>
        Acesso restrito ao time de CS da Seazone.

      <div>

        <input id="adm-email" type="email" autoComplete="username" value={email} onChange={(e) => setEmail(e.target.value)} required maxLength={320} />
      </div>
      <div>
        <label htmlFor="adm-pass">Senha</label>
        <input id="adm-pass" type="password" autoComplete="current-password" value={password} onChange={(e) => setPassword(e.target.value)} required minLength={6} maxLength={200} />
      </div>
      {err && <div className="admin-error">{err}</div>}
      <button className="btn btn-primary" type="submit" disabled={busy}>{busy ? "Entrando…" : "Entrar"}</button>
    </form>
  );
}

  const [rows, setRows] = useState(null);
  const [err, setErr] = useState(null);
  const [viewing, setViewing] = useState(null);

  const load = useCallback(async () => {
    setErr(null);
    const { data, error } = await sb.from("responses").select("id, created_at, candidato_nome, candidato_email, payload, resumo_md").order("created_at", { ascending: false });
    if (error) { setErr(error.message); return; }
    setRows(data || []);

  useEffect(() => { load(); }, [load]);

  const onDelete = async (id) => {
    if (!confirm("Apagar esta resposta permanentemente?")) return;
    const { error } = await sb.from("responses").delete().eq("id", id);
    if (error) { alert("Falha ao apagar: " + error.message); return; }
    load();

  const onDownload = (row) => {
    const safe = (row.candidato_nome || "candidato").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || "candidato";

              <div className="admin-row-actions">
                <button onClick={() => setViewing(r)}>Ver</button>
                <button onClick={() => onDownload(r)}>Baixar</button>
                <button className="danger" onClick={() => onDelete(r.id)}>Apagar</button>
              </div>
            </div>
          ))}
        </div>
      )}
      {viewing && (
        <div className="modal-backdrop" onClick={() => setViewing(null)}>
          <div className="modal" onClick={(e) => e.stopPropagation()}>
            <div className="modal-head">
              <h2>{viewing.candidato_nome}</h2>
              <button onClick={() => setViewing(null)} aria-label="Fechar">×</button>
            </div>
            <div className="modal-body">
              <p style={{ font: "var(--sz-type-subtle)", color: "var(--sz-fg-muted)", marginBottom: 12 }}>
                {viewing.candidato_email} · {new Date(viewing.created_at).toLocaleString("pt-BR", { dateStyle: "long", timeStyle: "short" })}
              </p>
              <pre>{viewing.resumo_md}</pre>
            </div>
            <div className="modal-foot">
              <button className="btn btn-ghost" onClick={() => setViewing(null)}>Fechar</button>
              <button className="btn btn-primary" onClick={() => onDownload(viewing)}>Baixar .md</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);

</script>
</body>
</html>
